name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_AUTHOR_NAME: "CI Test"
      GIT_AUTHOR_EMAIL: "ci@example.com"
      GIT_COMMITTER_NAME: "CI Test"
      GIT_COMMITTER_EMAIL: "ci@example.com"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Bandit
        run: bandit -r src/ -c pyproject.toml
      - name: Pytest
        run: pytest
      - name: GitVigil self-scan
        run: gitvigil scan . --fail-on high
