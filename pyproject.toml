[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gitvigil"
version = "0.1.0"
description = "Security-hardened scanner for leaked secrets and IaC misconfigurations across full Git history."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0.1",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "bandit[toml]>=1.7.9",
]

[project.scripts]
gitvigil = "gitvigil.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gitvigil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert, spawn git with fixed args, and embed fake credentials.
"tests/*" = ["S101", "S105", "S106", "S311", "S603", "S607"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
