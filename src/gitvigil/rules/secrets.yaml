# GitVigil secret-detection rules.
#
# Every regex is linted at load time (engine/regex_safety.py): all quantifiers must be bounded
# ({m,n}), no nested quantifiers, no backreferences. `keywords` is a cheap lowercase substring
# prefilter; a rule only runs on a line containing at least one keyword.
# `secret_group` selects the capture group holding the secret (0 = whole match).
version: 1
rules:
  # ---------------------------------------------------------------- AWS
  - id: aws-access-key-id
    description: AWS access key ID
    severity: CRITICAL
    keywords: [akia, asia, abia, acca]
    regex: '\b(?:AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16}\b'
  - id: aws-secret-access-key
    description: AWS secret access key assigned to an AWS-named variable
    severity: CRITICAL
    keywords: [aws]
    regex: '(?i)\baws\w{0,30}?(?:secret|sk)\w{0,20}["'']?\s{0,5}[:=]\s{0,5}["'']?([A-Za-z0-9/+=]{40})(?![A-Za-z0-9/+=])'
    secret_group: 1
    entropy_min: 3.5
  - id: aws-mws-auth-token
    description: Amazon MWS auth token
    severity: HIGH
    keywords: [amzn.mws]
    regex: '\bamzn\.mws\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b'

  # ---------------------------------------------------------------- Google Cloud
  - id: gcp-service-account
    description: Google Cloud service account key file
    severity: HIGH
    keywords: [service_account]
    regex: '"type"\s{0,5}:\s{0,5}"service_account"'
    redaction: full
    remediation: Delete the service account key in IAM, create a new one only if unavoidable, and prefer workload identity.
  - id: gcp-api-key
    description: Google API key
    severity: HIGH
    keywords: [aiza]
    regex: '\bAIza[0-9A-Za-z_\-]{35}(?![0-9A-Za-z_\-])'
  - id: gcp-oauth-client-secret
    description: Google OAuth client secret
    severity: HIGH
    keywords: [gocspx-]
    regex: '\bGOCSPX-[A-Za-z0-9_\-]{28}(?![A-Za-z0-9_\-])'
  - id: gcp-oauth-access-token
    description: Google OAuth access token
    severity: HIGH
    keywords: [ya29.]
    regex: '\bya29\.[0-9A-Za-z_\-]{30,200}'

  # ---------------------------------------------------------------- Azure
  - id: azure-storage-account-key
    description: Azure storage account key in a connection string
    severity: CRITICAL
    keywords: [accountkey=]
    regex: '(?i)\baccountkey=([A-Za-z0-9+/]{86}==)'
    secret_group: 1
  - id: azure-ad-client-secret
    description: Azure AD / Entra application client secret
    severity: CRITICAL
    keywords: [8q~]
    regex: '(?<![A-Za-z0-9_~.\-])[A-Za-z0-9_~.\-]{3}8Q~[A-Za-z0-9_~.\-]{31,34}(?![A-Za-z0-9_~.\-])'
    entropy_min: 3.5
  - id: azure-sas-token
    description: Azure shared access signature (SAS) token
    severity: HIGH
    keywords: [sig=]
    regex: '(?i)[?&]sv=\d{4}-\d{2}-\d{2}[^\s"'']{0,300}?[?&]sig=([A-Za-z0-9%+/]{43,120})'
    secret_group: 1
  - id: azure-shared-access-key
    description: Azure Service Bus / Event Hubs / IoT shared access key
    severity: CRITICAL
    keywords: [sharedaccesskey=]
    regex: '(?i)SharedAccessKey=([A-Za-z0-9+/]{43}=)'
    secret_group: 1

  # ---------------------------------------------------------------- GitHub
  - id: github-pat-classic
    description: GitHub personal access token (classic)
    severity: CRITICAL
    keywords: [ghp_]
    regex: '\bghp_[A-Za-z0-9]{36}\b'
  - id: github-pat-fine-grained
    description: GitHub fine-grained personal access token
    severity: CRITICAL
    keywords: [github_pat_]
    regex: '\bgithub_pat_[A-Za-z0-9_]{82}\b'
  - id: github-oauth-token
    description: GitHub OAuth access token
    severity: CRITICAL
    keywords: [gho_]
    regex: '\bgho_[A-Za-z0-9]{36}\b'
  - id: github-user-to-server-token
    description: GitHub App user-to-server token
    severity: CRITICAL
    keywords: [ghu_]
    regex: '\bghu_[A-Za-z0-9]{36}\b'
  - id: github-server-to-server-token
    description: GitHub App server-to-server (installation) token
    severity: CRITICAL
    keywords: [ghs_]
    regex: '\bghs_[A-Za-z0-9]{36}\b'
  - id: github-refresh-token
    description: GitHub refresh token
    severity: HIGH
    keywords: [ghr_]
    regex: '\bghr_[A-Za-z0-9]{36,80}\b'

  # ---------------------------------------------------------------- GitLab
  - id: gitlab-pat
    description: GitLab personal access token
    severity: CRITICAL
    keywords: [glpat-]
    regex: '\bglpat-[0-9A-Za-z_\-]{20,64}(?![0-9A-Za-z_\-])'
  - id: gitlab-pipeline-trigger-token
    description: GitLab pipeline trigger token
    severity: HIGH
    keywords: [glptt-]
    regex: '\bglptt-[0-9a-f]{40}\b'
  - id: gitlab-runner-token
    description: GitLab runner registration/authentication token
    severity: HIGH
    keywords: [glrt-, glrtr-]
    regex: '\bglrt[r]?-[0-9A-Za-z_\-]{20,64}(?![0-9A-Za-z_\-])'

  # ---------------------------------------------------------------- Slack
  - id: slack-bot-token
    description: Slack bot token
    severity: HIGH
    keywords: [xoxb-]
    regex: '\bxoxb-[0-9]{10,13}-[0-9]{10,13}-[A-Za-z0-9]{24,34}\b'
  - id: slack-user-token
    description: Slack user/legacy/refresh token
    severity: HIGH
    keywords: [xoxp-, xoxe-, xoxr-]
    regex: '\bxox[per]-[0-9]{9,13}-[0-9]{9,13}-(?:[0-9]{9,13}-)?[A-Za-z0-9]{24,48}\b'
  - id: slack-app-token
    description: Slack app-level token
    severity: HIGH
    keywords: [xapp-]
    regex: '\bxapp-[0-9]-[A-Z0-9]{8,12}-[0-9]{10,13}-[a-f0-9]{40,64}\b'
  - id: slack-webhook-url
    description: Slack incoming webhook URL
    severity: MEDIUM
    keywords: [hooks.slack.com]
    regex: 'https://hooks\.slack\.com/services/T[A-Z0-9]{8,12}/B[A-Z0-9]{8,12}/[A-Za-z0-9]{24}'

  # ---------------------------------------------------------------- Stripe
  - id: stripe-live-secret-key
    description: Stripe live secret API key
    severity: CRITICAL
    keywords: [sk_live_]
    regex: '\bsk_live_[0-9A-Za-z]{24,99}\b'
  - id: stripe-live-restricted-key
    description: Stripe live restricted API key
    severity: HIGH
    keywords: [rk_live_]
    regex: '\brk_live_[0-9A-Za-z]{24,99}\b'
  - id: stripe-webhook-secret
    description: Stripe webhook signing secret
    severity: HIGH
    keywords: [whsec_]
    regex: '\bwhsec_[A-Za-z0-9]{32,64}\b'

  # ---------------------------------------------------------------- AI providers
  - id: openai-api-key-legacy
    description: OpenAI API key (legacy format)
    severity: CRITICAL
    keywords: [t3blbkfj]
    regex: '\bsk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20}'
  - id: openai-api-key-project
    description: OpenAI project / service-account / admin API key
    severity: CRITICAL
    keywords: [sk-proj-, sk-svcacct-, sk-admin-]
    regex: '\bsk-(?:proj|svcacct|admin)-[A-Za-z0-9_\-]{40,200}'
  - id: anthropic-api-key
    description: Anthropic API key
    severity: CRITICAL
    keywords: [sk-ant-]
    regex: '\bsk-ant-(?:api|admin)[0-9]{2}-[A-Za-z0-9_\-]{80,120}'

  # ---------------------------------------------------------------- Keys, URIs, tokens
  - id: private-key-block
    description: PEM/OpenSSH/PGP private key
    severity: CRITICAL
    keywords: [private key]
    regex: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----'
    redaction: full
    remediation: Treat the key as compromised - generate a new key pair, revoke the old public key everywhere, and purge the file from history.
  - id: database-uri-credentials
    description: Database/broker connection URI with embedded password
    severity: HIGH
    keywords: ['://']
    regex: '\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss|amqps?|mssql|sqlserver|couchdb|cassandra)://[^\s:/@"''<>]{1,64}:([^\s:/@"''<>]{3,128})@[A-Za-z0-9_.\-]{1,255}'
    secret_group: 1
  - id: basic-auth-url
    description: HTTP(S) URL with embedded basic-auth credentials
    severity: HIGH
    keywords: ['http://', 'https://']
    regex: '\bhttps?://[^\s:/@"''<>]{1,64}:([^\s:/@"''<>]{3,128})@[A-Za-z0-9_.\-]{1,255}'
    secret_group: 1
    entropy_min: 2.5
  - id: jwt
    description: JSON Web Token
    severity: MEDIUM
    keywords: [eyj]
    regex: '\beyJ[A-Za-z0-9_\-]{10,2000}\.eyJ[A-Za-z0-9_\-]{10,2000}\.[A-Za-z0-9_\-]{10,2000}'
    remediation: Revoke the session/token if still valid and shorten token lifetimes; JWT payloads are only encoded, not encrypted.
  - id: generic-high-entropy-secret
    description: High-entropy value assigned to a secret-like variable name
    severity: MEDIUM
    keywords: [secret, token, passw, pwd, apikey, api_key, auth_key, authkey, access_key, accesskey, private_key, privatekey]
    regex: '(?i)\b(?:secret|token|passwd|password|pwd|api_?key|auth_?key|access_?key|private_?key|client_?secret)\w{0,20}["'']?\s{0,5}:?={1,2}>?\s{0,5}["'']([A-Za-z0-9_\-+/=.~]{16,128})["'']'
    secret_group: 1
    entropy_min: 3.6
    min_char_classes: 2
  - id: generic-high-entropy-secret-colon
    description: High-entropy value assigned (YAML/JSON style) to a secret-like key
    severity: MEDIUM
    keywords: [secret, token, passw, pwd, apikey, api_key, auth_key, authkey, access_key, accesskey, private_key, privatekey]
    regex: '(?i)\b(?:secret|token|passwd|password|pwd|api_?key|auth_?key|access_?key|private_?key|client_?secret)\w{0,20}["'']?\s{0,5}:\s{0,5}["'']([A-Za-z0-9_\-+/=.~]{16,128})["'']'
    secret_group: 1
    entropy_min: 3.6
    min_char_classes: 2

  # ---------------------------------------------------------------- SaaS & registries
  - id: twilio-api-key
    description: Twilio API key SID
    severity: HIGH
    keywords: [sk]
    regex: '\bSK[0-9a-f]{32}\b'
    entropy_min: 3.0
  - id: twilio-auth-token
    description: Twilio auth token assigned in context
    severity: HIGH
    keywords: [twilio]
    regex: '(?i)twilio\w{0,20}["'']?\s{0,5}[:=]\s{0,5}["'']?([0-9a-f]{32})\b'
    secret_group: 1
    entropy_min: 3.0
  - id: sendgrid-api-key
    description: SendGrid API key
    severity: HIGH
    keywords: [sg.]
    regex: '\bSG\.[A-Za-z0-9_\-]{22}\.[A-Za-z0-9_\-]{43}(?![A-Za-z0-9_\-])'
  - id: mailgun-api-key
    description: Mailgun API key
    severity: HIGH
    keywords: [key-]
    regex: '\bkey-[0-9a-f]{32}\b'
    entropy_min: 3.0
  - id: mailchimp-api-key
    description: Mailchimp API key
    severity: HIGH
    keywords: [-us]
    regex: '\b[0-9a-f]{32}-us[0-9]{1,2}\b'
    entropy_min: 3.0
  - id: npm-access-token
    description: npm access token
    severity: CRITICAL
    keywords: [npm_]
    regex: '\bnpm_[A-Za-z0-9]{36}\b'
  - id: pypi-upload-token
    description: PyPI upload token
    severity: CRITICAL
    keywords: [pypi-]
    regex: '\bpypi-AgEIcHlwaS5vcmc[A-Za-z0-9_\-]{50,200}'
  - id: digitalocean-token
    description: DigitalOcean personal access / OAuth token
    severity: CRITICAL
    keywords: [dop_v1_, doo_v1_]
    regex: '\bdo[op]_v1_[a-f0-9]{64}\b'
  - id: shopify-token
    description: Shopify access token
    severity: HIGH
    keywords: [shpat_, shpca_, shppa_, shpss_]
    regex: '\bshp(?:at|ca|pa|ss)_[a-f0-9]{32}\b'
  - id: square-access-token
    description: Square access token
    severity: HIGH
    keywords: [eaaa]
    regex: '\bEAAA[A-Za-z0-9_\-]{40,100}(?![A-Za-z0-9_\-])'
    entropy_min: 3.5
  - id: terraform-cloud-token
    description: Terraform Cloud / HCP API token
    severity: HIGH
    keywords: [.atlasv1.]
    regex: '\b[A-Za-z0-9]{14}\.atlasv1\.[A-Za-z0-9_\-]{60,70}(?![A-Za-z0-9_\-])'
  - id: databricks-token
    description: Databricks personal access token
    severity: HIGH
    keywords: [dapi]
    regex: '\bdapi[0-9a-f]{32}\b'
    entropy_min: 3.0
  - id: telegram-bot-token
    description: Telegram bot token
    severity: MEDIUM
    keywords: [':aa']
    regex: '\b[0-9]{8,10}:AA[A-Za-z0-9_\-]{33}(?![A-Za-z0-9_\-])'
  - id: discord-webhook-url
    description: Discord webhook URL
    severity: MEDIUM
    keywords: [discord]
    regex: 'https://(?:ptb\.|canary\.)?discord(?:app)?\.com/api/webhooks/[0-9]{17,20}/[A-Za-z0-9_\-]{60,80}'
  - id: dockerhub-pat
    description: Docker Hub personal access token
    severity: HIGH
    keywords: [dckr_pat_]
    regex: '\bdckr_pat_[A-Za-z0-9_\-]{27,64}(?![A-Za-z0-9_\-])'
  - id: linear-api-key
    description: Linear API key
    severity: HIGH
    keywords: [lin_api_]
    regex: '\blin_api_[A-Za-z0-9]{40}\b'
  - id: postman-api-key
    description: Postman API key
    severity: HIGH
    keywords: [pmak-]
    regex: '\bPMAK-[0-9a-f]{24}-[0-9a-f]{34}\b'
  - id: age-secret-key
    description: age encryption secret key
    severity: CRITICAL
    keywords: [age-secret-key-1]
    regex: '\bAGE-SECRET-KEY-1[QPZRY9X8GF2TVDW0S3JN54KHCE6MUA7L]{58}\b'
    redaction: full
